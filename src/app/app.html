<!-- Blocking dialog while there is no choice; its overlay covers everything below (RF-1). -->
<app-consent-dialog [visible]="choice() === null" (accept)="onAccept()" (reject)="onReject()" />

<!-- Overlay notice; it never blocks the controls below. -->
<app-phase-notice [message]="timer.notice()" (dismiss)="timer.dismissNotice()" />

<main class="flex flex-1 items-center justify-center px-4 py-8">
  <section
    class="flex min-w-0 w-full max-w-sm flex-col items-center gap-6 rounded-3xl bg-surface p-6 text-center shadow-sm ring-1 ring-track sm:p-8"
  >
    <header class="flex flex-col gap-1">
      <h1 class="text-2xl font-semibold">Pomodoro</h1>
      <p class="text-sm text-text/70">Concentración y descanso, sin distracciones.</p>
    </header>

    <!--
      Palette control inside the card, under the subtitle (RF-1): the card's
      `items-center` centres it, with the button aspect untouched (RF-3).
    -->
    <app-palette-picker [active]="palette.active()" (select)="palette.select($event)" />

    <app-timer-dial
      [progress]="timer.progress()"
      [remaining]="timer.remaining()"
      [phase]="timer.phase()"
    />

    <app-timer-controls
      [running]="timer.running()"
      (toggle)="timer.toggle()"
      (reset)="timer.reset()"
    />

    <app-time-inputs
      [focusMinutes]="timer.focusMinutes()"
      [breakMinutes]="timer.breakMinutes()"
      [disabled]="!timer.editable()"
      (focusChange)="timer.setFocusMinutes($event)"
      (breakChange)="timer.setBreakMinutes($event)"
    />
  </section>
</main>

<!-- Revocation footer: any stored choice while the dialog is closed (RF-6, CA-6.1). -->
<app-consent-footer [visible]="choice() !== null" (revoke)="onRevoke()" />
