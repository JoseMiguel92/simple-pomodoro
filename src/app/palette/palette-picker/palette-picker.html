<!--
  Palette picker (RF-1, RF-8): trigger button plus animated dropdown. Each
  option rectangle gets its colours from the palette data via inline styles —
  no hex literal is duplicated here (plan §2.1). The dropdown opens downward,
  anchored to the trigger and centred under it (005, RF-2), staying inside a
  375 px viewport when the picker sits inside the timer card (RNF-1).
-->
<div class="relative">
  <button
    #trigger
    type="button"
    class="flex h-11 w-11 items-center justify-center rounded-full bg-surface text-text ring-1 ring-track transition-transform select-none active:scale-95"
    aria-label="Elegir paleta de colores"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="listId"
    (click)="toggleOpen()"
  >
    <svg
      aria-hidden="true"
      class="h-5 w-5"
      viewBox="0 0 24 24"
      fill="currentColor"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        d="M12 2C6.49 2 2 6.49 2 12s4.49 10 10 10c1.38 0 2.5-1.12 2.5-2.5 0-.61-.23-1.19-.64-1.66-.08-.09-.13-.21-.13-.33 0-.28.22-.5.5-.5H16c3.31 0 6-2.69 6-6 0-4.96-4.49-9-10-9zM6.5 13c-.83 0-1.5-.67-1.5-1.5S5.67 10 6.5 10s1.5.67 1.5 1.5S7.33 13 6.5 13zm3-4C8.67 9 8 8.33 8 7.5S8.67 6 9.5 6s1.5.67 1.5 1.5S10.33 9 9.5 9zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 6 14.5 6s1.5.67 1.5 1.5S15.33 9 14.5 9zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 11 17.5 11s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"
      />
    </svg>
  </button>

  <div
    [id]="listId"
    role="group"
    aria-label="Paletas de colores"
    class="dropdown absolute top-full left-1/2 z-10 mt-2 w-48 -translate-x-1/2 rounded-2xl bg-surface p-2 shadow-lg ring-1 ring-track"
    [class.is-open]="open()"
  >
    @for (palette of palettes; track palette.id) {
      <button
        type="button"
        class="mb-1 flex w-full items-center gap-2 rounded-xl border-2 border-transparent px-3 py-2 text-left text-sm font-medium select-none last:mb-0 focus-visible:border-[var(--option-focus-color)] focus-visible:outline-none"
        [style.backgroundColor]="palette.bg"
        [style.color]="palette.text"
        [style.--option-focus-color]="palette.focus"
        [attr.aria-current]="isActive(palette.id) ? 'true' : null"
        (click)="choose(palette.id)"
      >
        <span class="w-4 text-center" aria-hidden="true">
          @if (isActive(palette.id)) {
            ✓
          }
        </span>
        <span>{{ palette.name }}</span>
      </button>
    }
  </div>
</div>
