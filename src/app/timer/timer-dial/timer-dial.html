<!-- Ring: `stroke-dashoffset` grows with the progress, so the ring drains. -->
<div class="relative mx-auto aspect-square w-full max-w-64">
  <svg viewBox="0 0 100 100" class="h-full w-full" aria-hidden="true">
    <g transform="rotate(-90 50 50)">
      <circle cx="50" cy="50" [attr.r]="radius" class="fill-none stroke-track" stroke-width="6" />
      <circle
        cx="50"
        cy="50"
        [attr.r]="radius"
        class="dial-progress fill-none"
        [class.stroke-focus]="phase() === 'focus'"
        [class.stroke-break]="phase() === 'break'"
        stroke-width="6"
        stroke-linecap="round"
        [attr.stroke-dasharray]="circumference"
        [attr.stroke-dashoffset]="dashOffset()"
      />
    </g>
  </svg>

  <div class="absolute inset-0 flex flex-col items-center justify-center gap-1">
    <span class="text-5xl font-semibold tabular-nums">{{ remaining() }}</span>
    <span class="text-sm tracking-wide text-text/70">{{ phaseLabel() }}</span>
  </div>
</div>
