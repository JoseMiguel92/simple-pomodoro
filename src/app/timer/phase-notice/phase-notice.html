<!-- Fixed to the top; the wrapper ignores clicks so it never blocks the controls. -->
@if (visible()) {
  <div
    class="pointer-events-none fixed inset-x-0 top-4 z-50 flex justify-center px-4"
    role="status"
    aria-live="polite"
  >
    <button
      type="button"
      data-testid="phase-notice"
      class="pointer-events-auto max-w-full rounded-2xl bg-accent px-4 py-3 text-center text-sm font-medium text-surface shadow-lg"
      (click)="hide()"
    >
      {{ message() }}
    </button>
  </div>
}
